<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tornike Zaridze — Projects</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --f-display: 'Playfair Display', Georgia, serif;
      --f-body: 'DM Sans', system-ui, sans-serif;
    }
    html, body {
      background: #0a0a0a;
      color: #fff;
      font-family: var(--f-body);
      min-height: 100%;
      overflow-x: hidden;
    }

    /* ── Back button ─────────────────────────────────────── */
    .back-btn {
      position: fixed; top: 20px; left: 20px; z-index: 100;
      display: flex; align-items: center; gap: 8px;
      color: rgba(255,255,255,0.48); font-size: 13px; font-weight: 400;
      text-decoration: none; letter-spacing: 0.04em;
      padding: 9px 18px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .back-btn:hover, .back-btn:active {
      color: #fff; border-color: rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.08);
    }
    .back-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* ── Lang switcher (top-right) ───────────────────────── */
    .lang-switcher {
      position: fixed; top: 20px; right: 20px; z-index: 100;
      display: flex; gap: 5px; align-items: center;
    }
    .lang-btn {
      padding: 6px 13px; border-radius: 999px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.08em; cursor: pointer; font-family: var(--f-body);
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.38); transition: all 0.2s ease;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    .lang-btn.lang-active {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.28);
      color: #fff;
    }
    .lang-btn:hover { border-color: rgba(255,255,255,0.22); color: rgba(255,255,255,0.7); }

    /* ── Page layout ─────────────────────────────────────── */
    .page-wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 120px 40px 100px;
    }

    /* ── Section heading ─────────────────────────────────── */
    .section-header {
      text-align: center;
      margin-bottom: 56px;
    }
    .section-pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 20px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.03);
      font-size: 13px; color: rgba(255,255,255,0.55);
      font-family: var(--f-body); margin-bottom: 20px;
    }
    .section-pill-dot {
      width: 10px; height: 10px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.5);
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .section-pill-dot::after {
      content: ''; width: 4px; height: 4px; border-radius: 50%;
      background: rgba(255,255,255,0.9); display: block;
    }
    .section-heading {
      font-family: var(--f-display);
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      font-weight: 400; color: #fff; line-height: 1.12; margin-bottom: 14px;
    }
    .section-heading em {
      color: rgba(255,255,255,0.28); font-weight: 300; font-style: italic;
    }
    .btn-primary {
      background: #fff; color: #000; border: none;
      padding: 13px 30px; border-radius: 999px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all 0.3s ease; font-family: var(--f-body);
      display: inline-flex; align-items: center; gap: 8px;
      text-decoration: none; margin-top: 20px;
    }
    .btn-primary:hover { transform: scale(1.03); box-shadow: 0 4px 24px rgba(255,255,255,0.16); }

    /* ── Project grid ────────────────────────────────────── */
    .proj-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    /* ── PoloCard shell ──────────────────────────────────── */
    .polo-card-wrap {
      background: #060606;
      border-radius: 20px;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.04);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 30px 80px rgba(0,0,0,0.6);
      transform: translateY(0);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .polo-card-wrap:hover {
      border-color: rgba(255,255,255,0.08);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 40px 100px rgba(0,0,0,0.8);
      transform: translateY(-6px);
    }
    .polo-card-inner {
      background: linear-gradient(180deg, #0d0d0d 0%, #0a0a0a 100%);
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.06);
      overflow: hidden;
      position: relative;
      min-height: 320px;
      transition: border-color 0.5s ease;
    }
    .polo-card-wrap:hover .polo-card-inner {
      border-color: rgba(255,255,255,0.12);
    }

    /* ── Project card content ────────────────────────────── */
    .proj-card-bg {
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 32px;
      position: relative;
      overflow: hidden;
    }
    .proj-img-wrap {
      position: absolute; inset: 0; z-index: 0;
      border-radius: inherit; overflow: hidden; background: #0a0a0a;
    }
    .proj-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: top center;
      filter: grayscale(100%) brightness(0.6);
      transition: filter 0.6s ease, transform 0.6s ease;
      display: block;
    }
    .proj-img-overlay {
      position: absolute; inset: 0; z-index: 1;
      background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.3) 45%, rgba(0,0,0,0.05) 100%);
      border-radius: inherit; pointer-events: none; transition: opacity 0.5s ease;
    }
    .proj-img-content { position: relative; z-index: 2; }
    .polo-card-wrap:hover .proj-img-wrap img {
      filter: grayscale(0%) brightness(1);
      transform: scale(1.03);
    }
    .polo-card-wrap:hover .proj-img-overlay { opacity: 0.65; }

    /* ── Project footer (arrow + title) ─────────────────── */
    .proj-footer { display: flex; align-items: center; gap: 14px; }
    .proj-sub {
      font-size: 11px; color: rgba(255,255,255,0.5);
      margin-bottom: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .proj-title {
      font-family: var(--f-display); font-size: 24px;
      font-weight: 400; margin: 0; color: #fff;
    }
    .proj-arrow-btn {
      flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%;
      background: rgba(10,10,10,0.92); border: 1px solid rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.25s ease, border-color 0.25s ease;
      text-decoration: none; color: #fff; position: relative; overflow: hidden;
    }
    .polo-card-wrap:hover .proj-arrow-btn {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.35);
    }
    .arr-out, .arr-in {
      position: absolute; font-size: 18px; line-height: 1;
    }
    .arr-out {
      transition: transform 0.45s cubic-bezier(0.65,0,0.35,1), opacity 0.45s cubic-bezier(0.65,0,0.35,1);
      transform: translate(0,0); opacity: 1;
    }
    .arr-in {
      transition: transform 0.45s cubic-bezier(0.65,0,0.35,1) 0.08s, opacity 0.45s cubic-bezier(0.65,0,0.35,1) 0.08s;
      transform: translate(-18px,18px); opacity: 0;
    }
    .proj-arrow-btn:hover .arr-out { transform: translate(18px,-18px); opacity: 0; }
    .proj-arrow-btn:hover .arr-in  { transform: translate(0,0); opacity: 1; }

    /* ── Mobile touch colour activation ─────────────────── */
    @media (max-width: 767px) {
      .polo-card-active .proj-img-wrap img {
        filter: grayscale(0%) brightness(1) !important;
        transform: scale(1.03) !important;
      }
      .polo-card-active .proj-img-overlay {
        background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.2) 60%, transparent 100%) !important;
      }
    }

    /* ── Responsive ──────────────────────────────────────── */
    @media (max-width: 767px) {
      .page-wrap { padding: 100px 20px 80px; }
      .proj-grid { grid-template-columns: 1fr; }
      .back-btn { top: 14px; left: 14px; font-size: 12px; padding: 8px 14px; }
      .lang-switcher { top: 14px; right: 14px; }
    }
  </style>
</head>
<body>

<a class="back-btn" href="index.html">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 12H5M12 5l-7 7 7 7"/>
  </svg>
  Back
</a>

<div class="lang-switcher">
  <button id="lang-toggle" class="lang-btn lang-active" onclick="setLang(localStorage.getItem('portfolio-lang')==='de'?'en':'de')">DE</button>
</div>

<div class="page-wrap">
  <div class="section-header">
    <div class="section-pill">
      <span class="section-pill-dot"></span>
      <span id="txt-pill">Recent Projects</span>
    </div>
    <h2 class="section-heading">
      <span id="txt-h"></span> <em id="txt-h-em"></em>
    </h2>
    <a class="btn-primary" href="index.html#contact" id="txt-btn">Contact Now</a>
  </div>

  <div class="proj-grid">

    <!-- Online Shop -->
    <div class="polo-card-wrap">
      <div class="polo-card-inner">
        <a href="projects/onlineshop.html" class="proj-card-bg" style="background:linear-gradient(135deg,#0f0f0f,#1a1a1a,#111);display:flex;flex-direction:column;justify-content:flex-end;padding:32px;position:relative;overflow:hidden;text-decoration:none;">
          <div class="proj-img-wrap"><img src="assets/projects/onlineshop.png" alt="Online Shop"/></div>
          <div class="proj-img-overlay"></div>
          <div class="proj-img-content">
            <p class="proj-sub">React · Node.js · PostgreSQL</p>
            <div class="proj-footer">
              <span class="proj-arrow-btn" aria-label="Open Online Shop">
                <span class="arr-out">↗︎</span>
                <span class="arr-in">↗︎</span>
              </span>
              <h3 class="proj-title">Online Shop</h3>
            </div>
          </div>
        </a>
      </div>
    </div>

    <!-- Brand Studio AI -->
    <div class="polo-card-wrap">
      <div class="polo-card-inner">
        <a href="projects/ai-platform.html" class="proj-card-bg" style="background:linear-gradient(135deg,#0d0d0d,#181818,#0f0f0f);display:flex;flex-direction:column;justify-content:flex-end;padding:32px;position:relative;overflow:hidden;text-decoration:none;">
          <div class="proj-img-wrap"><img src="assets/projects/ai-platform.png" alt="Brand Studio AI"/></div>
          <div class="proj-img-overlay"></div>
          <div class="proj-img-content">
            <p class="proj-sub">Next.js · OpenAI · TypeScript</p>
            <div class="proj-footer">
              <span class="proj-arrow-btn" aria-label="Open Brand Studio AI">
                <span class="arr-out">↗︎</span>
                <span class="arr-in">↗︎</span>
              </span>
              <h3 class="proj-title">Brand Studio AI</h3>
            </div>
          </div>
        </a>
      </div>
    </div>

    <!-- Ivunex Logistics -->
    <div class="polo-card-wrap">
      <div class="polo-card-inner">
        <a href="projects/ivunex.html" class="proj-card-bg" style="background:linear-gradient(160deg,#111,#151520,#0d0d0d);display:flex;flex-direction:column;justify-content:flex-end;padding:32px;position:relative;overflow:hidden;text-decoration:none;">
          <div class="proj-img-wrap"><img src="assets/projects/ivunex.png" alt="Ivunex Logistics"/></div>
          <div class="proj-img-overlay"></div>
          <div class="proj-img-content">
            <p class="proj-sub">React · Node.js · Stripe</p>
            <div class="proj-footer">
              <span class="proj-arrow-btn" aria-label="Open Ivunex Logistics">
                <span class="arr-out">↗︎</span>
                <span class="arr-in">↗︎</span>
              </span>
              <h3 class="proj-title">Ivunex Logistics</h3>
            </div>
          </div>
        </a>
      </div>
    </div>

    <!-- FLY.CLOUD -->
    <div class="polo-card-wrap">
      <div class="polo-card-inner">
        <a href="projects/flycloud.html" class="proj-card-bg" style="background:linear-gradient(135deg,#080d1a,#0d1a2e,#060c18);display:flex;flex-direction:column;justify-content:flex-end;padding:32px;position:relative;overflow:hidden;text-decoration:none;">
          <div class="proj-img-wrap"><img src="assets/projects/flycloud.png" alt="FLY.CLOUD"/></div>
          <div class="proj-img-overlay"></div>
          <div class="proj-img-content">
            <p class="proj-sub">Next.js · Socket.io · OpenAI</p>
            <div class="proj-footer">
              <span class="proj-arrow-btn" aria-label="Open FLY.CLOUD">
                <span class="arr-out">↗︎</span>
                <span class="arr-in">↗︎</span>
              </span>
              <h3 class="proj-title">FLY.CLOUD</h3>
            </div>
          </div>
        </a>
      </div>
    </div>

  </div>
</div>

<script>
  var T = {
    en: {
      pill: 'Recent Projects',
      h: 'Elevating Brands',
      h_em: 'to Drive Success and Impact',
      btn: 'Contact Now'
    },
    de: {
      pill: 'Aktuelle Projekte',
      h: 'Marken stärken,',
      h_em: 'um Erfolg und Wirkung zu erzielen',
      btn: 'Jetzt kontaktieren'
    }
  };

  function applyLang(lang) {
    var t = T[lang] || T.en;
    document.getElementById('txt-pill').textContent = t.pill;
    document.getElementById('txt-h').textContent = t.h;
    document.getElementById('txt-h-em').textContent = t.h_em;
    document.getElementById('txt-btn').textContent = t.btn;
    var toggle = document.getElementById('lang-toggle');
    if (toggle) toggle.textContent = lang.toUpperCase();
    document.documentElement.lang = lang;
  }

  function setLang(lang) {
    localStorage.setItem('portfolio-lang', lang);
    applyLang(lang);
  }

  // Touch activation for mobile colour reveal
  document.querySelectorAll('.polo-card-wrap').forEach(function(card) {
    card.addEventListener('touchstart', function() { card.classList.add('polo-card-active'); }, { passive: true });
    card.addEventListener('touchend',   function() { card.classList.remove('polo-card-active'); }, { passive: true });
  });

  applyLang(localStorage.getItem('portfolio-lang') || 'en');
</script>
</body>
</html>
