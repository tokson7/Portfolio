<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tornike Zaridze — 3D Logo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #080808;
      overflow: hidden;
      font-family: 'DM Sans', sans-serif;
    }
    canvas {
      display: block;
      width: 100vw; height: 100vh;
      touch-action: none;
    }
    /* Back button */
    .back-btn {
      position: fixed; top: 20px; left: 20px; z-index: 100;
      display: flex; align-items: center; gap: 8px;
      color: rgba(255,255,255,0.55); font-size: 13px; font-weight: 400;
      text-decoration: none; letter-spacing: 0.04em;
      padding: 9px 18px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .back-btn:hover, .back-btn:active { color: #fff; border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); }
    .back-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
    @media (max-width: 480px) {
      .back-btn { top: 16px; left: 16px; font-size: 12px; padding: 8px 14px; }
      .hint     { font-size: 11px; bottom: 24px; }
    }

    /* Hint */
    .hint {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.28); font-size: 12px; letter-spacing: 0.12em;
      text-transform: uppercase; pointer-events: none;
      transition: opacity 1s ease;
    }
    .hint.hidden { opacity: 0; }

    /* FPS / debug hidden by default */
    #dbg { display: none; }
  </style>
</head>
<body>

  <a class="back-btn" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    Back
  </a>

  <p class="hint" id="hint">Drag to scatter</p>

  <canvas id="c"></canvas>

  <!-- Three.js r165 — full build, no ES modules needed -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

  <script>
  /* ═══════════════════════════════════════════════════════════════════════
     TORNIKE ZARIDZE — 3D PARTICLE LOGO
     Architecture:
       • Three.js r134 WebGL renderer
       • Instanced mesh (SphereGeometry) — one draw call for all particles
       • SDF sampling of the logo shape (rounded rect frame + ">" + "_")
       • Spring physics: each particle has rest pos + velocity + damping
       • Scatter: mouse proximity → radial impulse → particles explode outward
       • Reassembly: spring force pulls each particle back to rest position
       • Continuous slow Y rotation of the whole formation
       • Ambient colour pulse on particles
  ═══════════════════════════════════════════════════════════════════════ */

  (function () {
    'use strict';

    /* ── Renderer ─────────────────────────────────────────────── */
    const canvas   = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x080808, 1);
    renderer.shadowMap.enabled = false;

    /* ── Scene / Camera ───────────────────────────────────────── */
    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.set(0, 0, 28);

    /* ── Lights ───────────────────────────────────────────────── */
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.35);
    scene.add(ambientLight);

    const keyLight = new THREE.PointLight(0xf0ece4, 2.2, 80);
    keyLight.position.set(-12, 10, 18);
    scene.add(keyLight);

    const fillLight = new THREE.PointLight(0xd6d0c8, 1.2, 80);
    fillLight.position.set(14, -8, 12);
    scene.add(fillLight);

    const rimLight = new THREE.PointLight(0xffffff, 1.0, 60);
    rimLight.position.set(0, 0, -20);
    scene.add(rimLight);

    /* ── Logo SDF sampling ────────────────────────────────────── */
    /*
      Logo shape (normalised, centred at origin, half-size ≈ 1):
        1. Rounded rect frame   (stroke, not fill)
        2. ">" chevron symbol   (left side)
        3. "_" underscore       (right side)
      We sample points on/near these shapes and collect 3D rest positions.
    */

    // SDF helpers
    function sdRoundedRect(x, y, hw, hh, r) {
      const qx = Math.abs(x) - hw + r;
      const qy = Math.abs(y) - hh + r;
      return Math.sqrt(Math.max(qx,0)**2 + Math.max(qy,0)**2) + Math.min(Math.max(qx,qy),0) - r;
    }

    function sdSegment(px, py, ax, ay, bx, by) {
      const dx = bx - ax, dy = by - ay;
      const len2 = dx*dx + dy*dy;
      let t = ((px-ax)*dx + (py-ay)*dy) / len2;
      t = Math.max(0, Math.min(1, t));
      const nx = px - (ax + t*dx);
      const ny = py - (ay + t*dy);
      return Math.sqrt(nx*nx + ny*ny);
    }

    // Returns distance-to-logo-shape for a 2D point (x,y) in [-1,1] space
    // negative = inside shape border
    const FRAME_HW   = 0.85;
    const FRAME_HH   = 0.85;
    const FRAME_R    = 0.18;
    const STROKE_W   = 0.07;

    function logoSDF(x, y) {
      // Frame stroke: d ≈ 0 means on the stroke
      const dFrame = Math.abs(sdRoundedRect(x, y, FRAME_HW, FRAME_HH, FRAME_R)) - STROKE_W;

      // ">" — two line segments meeting at a point (matches SVG path: 32,38 → 48,50 → 32,62 in 100-unit space)
      // normalised: x' = (x-50)/50, y' = (50-y)/50  (flip Y since SVG Y goes down)
      // 32,38 → (-0.36, 0.24); 48,50 → (-0.04, 0.0); 32,62 → (-0.36, -0.24)
      const gt1 = sdSegment(x, y, -0.36, 0.24, -0.04,  0.0);
      const gt2 = sdSegment(x, y, -0.04, 0.0,  -0.36, -0.24);
      const dGt = Math.min(gt1, gt2) - 0.05;

      // "_" — horizontal bar (SVG: rect x=54,y=60,w=16,h=4 → centre 62,62)
      // normalised centre: x'=(62-50)/50=0.24, y'=(50-62)/50=-0.24
      // width in norm: 16/50=0.32, treat as segment
      const dUs = sdSegment(x, y, 0.08, -0.24, 0.40, -0.24) - 0.05;

      return Math.min(dFrame, dGt, dUs);
    }

    /* ── Particle placement — stratified sampling ─────────────── */
    const SCALE        = 2.125;  // world-space logo half-size
    const PARTICLE_R   = 0.02375; // sphere radius
    const THRESHOLD    = 0.045; // keep particles where |sdf| < threshold (on shape)
    // Reduce particle count on mobile for performance
    const isMobile     = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 768;
    const GRID_STEPS   = isMobile ? 150 : 210;   // grid resolution

    const restPositions = []; // THREE.Vector3[]

    const depth_range  = 0.55; // thick 3D depth

    for (let xi = 0; xi < GRID_STEPS; xi++) {
      for (let yi = 0; yi < GRID_STEPS; yi++) {
        const nx = (xi / (GRID_STEPS - 1)) * 2 - 1;
        const ny = (yi / (GRID_STEPS - 1)) * 2 - 1;
        const d  = logoSDF(nx, ny);
        if (Math.abs(d) < THRESHOLD) {
          // Jitter slightly for organic feel
          const jx = (Math.random() - 0.5) * 0.008;
          const jy = (Math.random() - 0.5) * 0.008;
          const jz = (Math.random() - 0.5) * depth_range;
          restPositions.push(new THREE.Vector3(
            (nx + jx) * SCALE,
            (ny + jy) * SCALE,
            jz
          ));
        }
      }
    }

    // Add a second denser pass for fill
    const GRID_STEPS2 = isMobile ? 220 : 310;
    for (let xi = 0; xi < GRID_STEPS2; xi++) {
      for (let yi = 0; yi < GRID_STEPS2; yi++) {
        const nx = (xi / (GRID_STEPS2 - 1)) * 2 - 1;
        const ny = (yi / (GRID_STEPS2 - 1)) * 2 - 1;
        const d  = logoSDF(nx, ny);
        if (Math.abs(d) < THRESHOLD * 0.55) {
          const jx = (Math.random() - 0.5) * 0.006;
          const jy = (Math.random() - 0.5) * 0.006;
          const jz = (Math.random() - 0.5) * depth_range * 0.7;
          restPositions.push(new THREE.Vector3(
            (nx + jx) * SCALE,
            (ny + jy) * SCALE,
            jz
          ));
        }
      }
    }

    const N = restPositions.length;
    console.log('Particle count:', N);

    /* ── Instanced mesh ───────────────────────────────────────── */
    const sphereGeo = new THREE.SphereGeometry(PARTICLE_R, 7, 5);
    const material  = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      metalness: 0.72,
      roughness: 0.28,
    });

    const mesh = new THREE.InstancedMesh(sphereGeo, material, N);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    if (mesh.instanceColor) mesh.instanceColor.setUsage(THREE.DynamicDrawUsage);
    scene.add(mesh);

    /* Per-particle state */
    const pos  = new Float32Array(N * 3); // current x,y,z
    const vel  = new Float32Array(N * 3); // velocity x,y,z
    const rest = new Float32Array(N * 3); // rest positions

    for (let i = 0; i < N; i++) {
      const rp = restPositions[i];
      rest[i*3]   = rp.x;
      rest[i*3+1] = rp.y;
      rest[i*3+2] = rp.z;
      // Start directly at rest position — no assembly animation
      pos[i*3]   = rp.x;
      pos[i*3+1] = rp.y;
      pos[i*3+2] = rp.z;
      vel[i*3]   = 0; vel[i*3+1] = 0; vel[i*3+2] = 0;
    }

    /* Temp matrices for instancing */
    const _mat = new THREE.Matrix4();
    const _q   = new THREE.Quaternion();
    const _s   = new THREE.Vector3(1, 1, 1);
    const _v   = new THREE.Vector3();
    const _c   = new THREE.Color();

    /* ── Physics constants ────────────────────────────────────── */
    const SPRING_K    = 0.007;   // very gentle pull — slow leaf-like return
    const DAMPING     = 0.974;   // high air resistance — particles glide, no bounce
    const SCATTER_R   = 0.55;    // mouse influence radius (world units)
    const SCATTER_F   = 0.22;    // soft wind push — not instant impulse
    const INTRINSIC_A = 0.00015; // barely-visible breathing noise
    const VEL_MAX     = 0.18;    // velocity cap — prevents particles flying off screen

    /* ── Formation group (handles rotation) ─────────────────────*/
    const group = new THREE.Group();
    scene.add(group);
    group.add(mesh);

    // Move rest positions into group local space
    // (group will rotate; rest pos is in local space; physics in world space)
    // For simplicity physics runs in world space, group rotation applied as euler each frame

    /* ── Mouse / pointer state ────────────────────────────────── */
    let mouseNDC  = new THREE.Vector2(9999, 9999); // off-screen initially
    let isPointer = false;
    let isDown    = false;

    // Ray-based mouse interaction — correct at ANY rotation angle.
    // Intersect ray with the group's local Z=0 plane to get a 2D mouse position.
    // Then use full 3D distance from each particle to that point + curl for organic feel.
    const raycaster       = new THREE.Raycaster();
    const _rayOriginLocal = new THREE.Vector3();
    const _rayDirLocal    = new THREE.Vector3();
    const _invGroupMat    = new THREE.Matrix4();
    const _mouseLocal     = new THREE.Vector3(); // mouse projected onto local Z=0 plane

    function onPointerMove(e) {
      const rect = canvas.getBoundingClientRect();
      const src  = (e.touches && e.touches.length > 0) ? e.touches[0] : e;
      mouseNDC.x =  ((src.clientX - rect.left) / rect.width)  * 2 - 1;
      mouseNDC.y = -((src.clientY - rect.top)  / rect.height) * 2 + 1;
      isPointer = true;
      const h = document.getElementById('hint');
      if (h) h.classList.add('hidden');
    }

    function onPointerDown(e) { isDown = true; onPointerMove(e); }
    function onPointerUp()    { isDown = false; }
    function onPointerLeave() { isPointer = false; isDown = false; mouseNDC.set(9999, 9999); }
    function onTouchEnd()     { isDown = false; isPointer = false; mouseNDC.set(9999, 9999); }

    canvas.addEventListener('pointermove', onPointerMove, { passive: true });
    canvas.addEventListener('pointerdown', onPointerDown, { passive: true });
    canvas.addEventListener('pointerup',   onPointerUp,   { passive: true });
    canvas.addEventListener('pointerleave',onPointerLeave,{ passive: true });
    canvas.addEventListener('pointercancel',onPointerLeave,{ passive: true });
    canvas.addEventListener('touchmove',   onPointerMove, { passive: true });
    canvas.addEventListener('touchstart',  onPointerDown, { passive: true });
    canvas.addEventListener('touchend',    onTouchEnd,    { passive: true });
    canvas.addEventListener('touchcancel', onTouchEnd,    { passive: true });

    /* ── Resize — adaptive camera distance to fit logo on any screen ── */
    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      // Compute camera Z — multiply by large factor so logo is small in viewport
      const margin   = SCALE * 4.72;  // logo appears at ~1/4 of viewport
      const vHalf    = camera.fov * Math.PI / 360;   // half vFOV in radians
      const hHalf    = Math.atan(Math.tan(vHalf) * camera.aspect);
      const distV    = margin / Math.tan(vHalf);
      const distH    = margin / Math.tan(hHalf);
      const camZ     = Math.max(distV, distH);
      camera.position.z = camZ;
      // Push logo to near top of viewport: offset = 80% of visible half-height minus logo half-size
      const visibleHalfH = Math.tan(vHalf) * camZ;
      group.position.y   = visibleHalfH * 0.78 - SCALE * 1.1;
      camera.updateProjectionMatrix();
    }
    resize();
    window.addEventListener('resize', resize, { passive: true });

    /* ── Colour palette (white / cream / ash / ghost) ──────────── */
    const palette = [
      new THREE.Color(0.92, 0.92, 0.90),   // warm white
      new THREE.Color(0.78, 0.76, 0.72),   // cream
      new THREE.Color(0.58, 0.57, 0.56),   // ash gray
      new THREE.Color(0.96, 0.96, 0.95),   // ghost white
    ];

    function lerpColor(a, b, t) {
      return new THREE.Color(
        a.r + (b.r - a.r) * t,
        a.g + (b.g - a.g) * t,
        a.b + (b.b - a.b) * t
      );
    }

    /* ── Main render loop ─────────────────────────────────────── */
    let t = 0;
    const ROTATE_SPEED = 0.005242;

    function tick() {
      requestAnimationFrame(tick);
      t++;

      /* Group rotation (slow continuous Y spin only) */
      group.rotation.y += ROTATE_SPEED;

      /* Update mouse in group local space — intersect ray with local Z=0 plane.
         This gives a true 2D cursor position on the logo face, at any rotation. */
      if (isPointer) {
        raycaster.setFromCamera(mouseNDC, camera);
        _invGroupMat.copy(group.matrixWorld).invert();
        _rayOriginLocal.copy(raycaster.ray.origin).applyMatrix4(_invGroupMat);
        _rayDirLocal.copy(raycaster.ray.direction).transformDirection(_invGroupMat);
        // Intersect with local Z=0 plane: t = -originZ / dirZ
        const tPlane = Math.abs(_rayDirLocal.z) > 0.0001
          ? -_rayOriginLocal.z / _rayDirLocal.z
          : -_rayOriginLocal.z;
        _mouseLocal.set(
          _rayOriginLocal.x + tPlane * _rayDirLocal.x,
          _rayOriginLocal.y + tPlane * _rayDirLocal.y,
          0
        );
      }

      /* Physics update */
      const scatterActive  = isPointer;
      const scatterRadius2 = SCATTER_R * SCATTER_R;
      const scatterStrength = isDown ? SCATTER_F * 1.6 : SCATTER_F;

      for (let i = 0; i < N; i++) {
        const ix = i*3, iy = i*3+1, iz = i*3+2;

        /* Spring back to rest */
        const dx = rest[ix] - pos[ix];
        const dy = rest[iy] - pos[iy];
        const dz = rest[iz] - pos[iz];

        vel[ix] += dx * SPRING_K;
        vel[iy] += dy * SPRING_K;
        vel[iz] += dz * SPRING_K;

        /* Scatter: push away from mouse position projected onto logo plane.
           3D distance includes Z depth → particles at different depths
           get pushed at different angles → organic, non-circular dispersion.
           Curl component adds slight swirl — like wind carrying leaves. */
        if (scatterActive) {
          const sx = pos[ix] - _mouseLocal.x;
          const sy = pos[iy] - _mouseLocal.y;
          const sz = pos[iz]; // distance from Z=0 (logo face)
          const d2 = sx*sx + sy*sy + sz*sz;
          if (d2 < scatterRadius2 && d2 > 0.0001) {
            const d = Math.sqrt(d2);
            const f = (1 - d / SCATTER_R) * scatterStrength;
            // Curl: rotate force ~25° for organic swirl instead of pure radial
            const CURL = 0.45;
            vel[ix] += (sx - sy * CURL) * f;
            vel[iy] += (sy + sx * CURL) * f;
            vel[iz] += sz * f * 0.5;
          }
        }

        /* Tiny life noise */
        vel[ix] += (Math.random() - 0.5) * INTRINSIC_A;
        vel[iy] += (Math.random() - 0.5) * INTRINSIC_A;
        vel[iz] += (Math.random() - 0.5) * INTRINSIC_A * 0.3;

        /* Damping */
        vel[ix] *= DAMPING;
        vel[iy] *= DAMPING;
        vel[iz] *= DAMPING;

        /* Velocity cap — prevent particles from escaping far */
        const spd2 = vel[ix]*vel[ix] + vel[iy]*vel[iy] + vel[iz]*vel[iz];
        if (spd2 > VEL_MAX * VEL_MAX) {
          const inv = VEL_MAX / Math.sqrt(spd2);
          vel[ix] *= inv; vel[iy] *= inv; vel[iz] *= inv;
        }

        /* Integrate */
        pos[ix] += vel[ix];
        pos[iy] += vel[iy];
        pos[iz] += vel[iz];
      }

      /* Update instanced mesh */
      const colorCycle = (Math.sin(t * 0.004) * 0.5 + 0.5);
      const ci = Math.floor(colorCycle * (palette.length - 1));
      const ct = (colorCycle * (palette.length - 1)) % 1;
      const baseColor = lerpColor(palette[ci % palette.length], palette[(ci+1) % palette.length], ct);

      for (let i = 0; i < N; i++) {
        _v.set(pos[i*3], pos[i*3+1], pos[i*3+2]);
        _mat.compose(_v, _q, _s);
        mesh.setMatrixAt(i, _mat);

        /* Per-particle colour: vary by distance from rest (scattered = brighter) */
        const ddx = pos[i*3]   - rest[i*3];
        const ddy = pos[i*3+1] - rest[i*3+1];
        const ddz = pos[i*3+2] - rest[i*3+2];
        const displaced = Math.sqrt(ddx*ddx + ddy*ddy + ddz*ddz);
        const scatter_t = Math.min(1, displaced / 3.5);
        const scatterColor = new THREE.Color(0.97, 0.97, 0.95);
        const c = lerpColor(baseColor, scatterColor, scatter_t * 0.5);
        mesh.setColorAt(i, c);
      }

      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;

      /* Light animation */
      keyLight.position.x  = Math.sin(t * 0.006) * 14;
      keyLight.position.y  = Math.cos(t * 0.004) * 10;
      fillLight.position.x = Math.cos(t * 0.007) * 14;
      fillLight.position.y = Math.sin(t * 0.005) * 9;

      renderer.render(scene, camera);
    }

    tick();

  })();
  </script>
</body>
</html>
